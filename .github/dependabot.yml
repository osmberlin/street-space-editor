# From the FMC tech-stack template (tilda-geo), trimmed for this repo.
# Schedule: open-source repos → first Friday of the month, 07:00 Europe/Berlin.
# Bun workspaces with one root bun.lock: root, app and every package are listed.
version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
      - /app
      - /packages/*
    schedule:
      interval: cron
      cronjob: '0 7 * * FRI#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    exclude-paths:
      - .cursor/**
      - .agents/**
    commit-message:
      prefix: chore
      include: scope
    groups:
      security-dev-tools:
        applies-to: security-updates
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - 'vitest*'
          - '@testing-library/*'
          - 'husky*'
          - '@types/*'
          - 'typescript'
          - '@typescript/typescript-*'
          - 'eslint*'

      shared-monorepo-tools:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - '@types/bun'
          - 'bun-types'

      app-dev-minor-patch:
        applies-to: version-updates
        patterns:
          - '@clack/*'
          - '@testing-library/*'
          - '@vitejs/*'
          - 'babel-plugin-*'
          - 'browserslist*'
          - 'eslint-*'
          - 'husky'
          - 'jsdom'
          - 'oxc-*'
          - 'oxfmt'
          - 'oxlint*'
          - 'vitest'
          - 'vite'
          - '@types/*'
          - 'typescript'
          - '@typescript/typescript-*'
          - '@changesets/*'
          - '@inlang/*'
          - 'picocolors'
          - 'sass'
          - 'tsup'
        update-types:
          - minor
          - patch

      app-framework-minor-patch:
        applies-to: version-updates
        patterns:
          - '@tanstack/*'
          - '@tailwindcss/*'
          - 'tailwindcss'
          - '@turf/*'
          - 'react'
          - 'react-dom'
          - '@types/react*'
          - 'maplibre-gl'
          - 'react-map-gl'
          - 'zod'
          - '@headlessui/*'
          - 'zustand'
          - 'mapillary-js'
          - '@panoramax/*'
        update-types:
          - minor
          - patch

      app-prod-misc-patch:
        applies-to: version-updates
        update-types:
          - patch
        patterns:
          - '*'
        exclude-patterns:
          - '@tanstack/*'
          - '@tailwindcss/*'
          - 'tailwindcss'
          - '@turf/*'
          - 'react'
          - 'react-dom'
          - 'maplibre-gl'
          - 'react-map-gl'
          - 'zod'
          - '@headlessui/*'
          - 'zustand'
          - 'mapillary-js'
          - '@panoramax/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 7 * * FRI#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
